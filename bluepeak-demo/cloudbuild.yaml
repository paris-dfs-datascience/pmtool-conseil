steps:
  # 1. Build the Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/competitor-intel-job:latest', '.']

  # 2. Push the Image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/competitor-intel-job:latest']

  # 3. Deploy (or Update) the Cloud Run Job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'competitor-intel-job'
      - '--image'
      - 'gcr.io/$PROJECT_ID/competitor-intel-job:latest'
      - '--region'
      - 'us-central1'
      - '--max-retries'
      - '0'     # 0 retries = fail fast if script errors (easier to debug)
      - '--task-timeout'
      - '3600s' # 1 hour timeout (plenty of time for 12 zips)
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID'

# Define which images this build produces
images:
  - 'gcr.io/$PROJECT_ID/competitor-intel-job:latest'