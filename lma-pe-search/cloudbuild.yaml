steps:
  # Build and Push
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/le-marais-intel-job:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/le-marais-intel-job:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/le-marais-intel-job:latest']

  # Deploy as a Cloud Run JOB
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        gcloud run jobs deploy le-marais-intel-job \
          --image=gcr.io/$PROJECT_ID/le-marais-intel-job:latest \
          --region=us-central1 \
          --set-env-vars=PROJECT_ID=$PROJECT_ID,BUCKET_NAME=${_GCS_BUCKET} \
          --max-retries=0 \
          --memory=1Gi \
          --cpu=1 \
          --task-timeout=10m

images:
  - 'gcr.io/$PROJECT_ID/le-marais-intel-job:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/le-marais-intel-job:latest'

substitutions:
  _GCS_BUCKET: 'le-marais-intelligence-leads'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'