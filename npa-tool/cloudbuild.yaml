steps:
  # Build and push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/lma-website-461920/document-processor', '.']
    
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/lma-website-461920/document-processor']
    
  # DEBUG: Test secret access
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Secret value length: $${#SENDER_PASSWORD}"
        echo "First 4 chars: $${SENDER_PASSWORD:0:4}"
    secretEnv: ['SENDER_PASSWORD']
    
  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy document-processor \
          --image=gcr.io/lma-website-461920/document-processor \
          --region=us-central1 \
          --platform=managed \
          --allow-unauthenticated \
          --memory=2Gi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=1 \
          --port=8080 \
          --set-env-vars=SENDER_EMAIL=matthew.paris@lemaraisadvisory.com \
          --set-env-vars=SENDER_PASSWORD="$$SENDER_PASSWORD" \
          --set-env-vars=SMTP_SERVER=smtp.gmail.com \
          --set-env-vars=SMTP_PORT=587
    secretEnv: ['SENDER_PASSWORD']

availableSecrets:
  secretManager:
  - versionName: projects/lma-website-461920/secrets/sender-password/versions/latest
    env: 'SENDER_PASSWORD'

images:
  - 'gcr.io/lma-website-461920/document-processor'